---
layout: default
---
<main class="post-main">
    <article class="post">
        <header class="post-header">
            <p class="post-meta">
                {{ page.section | capitalize }} · {{ page.date | date: "%d %B %Y" }}
            </p>

            <h1>{{ page.title }}</h1>

            {% if page.excerpt %}
                <p class="post-dek">{{ page.excerpt }}</p>
            {% endif %}
        </header>

        <div class="post-content">
            {{ content }}
        </div>
    </article>
</main>
