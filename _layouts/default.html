---
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}
    </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>
    <header class="site-header">
        <div class="site-header__inner">
            <a class="site-brand" href="{{ '/' | relative_url }}">
                <span class="site-brand__name">The Thinking Space</span>
            </a>

            <nav class="site-nav" aria-label="Main navigation">
                <a class="{% if page.nav == 'home' %}is-active{% endif %}" href="{{ '/' | relative_url }}">Home</a>
                <a class="{% if page.nav == 'ideas' %}is-active{% endif %}" href="{{ '/ideas.html' | relative_url }}">Ideas</a>
                <a class="{% if page.nav == 'notes' %}is-active{% endif %}" href="{{ '/notes.html' | relative_url }}">Notes</a>
                <a class="{% if page.nav == 'research' %}is-active{% endif %}" href="{{ '/research.html' | relative_url }}">Research</a>
                <a class="{% if page.nav == 'projects' %}is-active{% endif %}" href="{{ '/projects.html' | relative_url }}">Projects</a>
                <a class="{% if page.nav == 'about' %}is-active{% endif %}" href="{{ '/about.html' | relative_url }}">About</a>
            </nav>
        </div>
    </header>

    {{ content }}
    <footer class="site-footer">
    <div class="site-footer__inner">
        <span>The Thinking Space</span>
        <span>All Rights Reserved</span>
    </div>
</footer>
</body>
</html>
