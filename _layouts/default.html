<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ site.description }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header">
        <div class="site-header__inner">
            <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="The Thinking Space home">
                <span class="site-brand__name">The Thinking Space</span>
            </a>

            <nav class="site-nav" aria-label="Main navigation">
                <a class="{% if page.nav == 'home' %}is-active{% endif %}" {% if page.nav == 'home' %}aria-current="page"{% endif %} href="{{ '/' | relative_url }}">Home</a>
                <a class="{% if page.nav == 'ideas' %}is-active{% endif %}" {% if page.nav == 'ideas' %}aria-current="page"{% endif %} href="{{ '/ideas.html' | relative_url }}">Ideas</a>
                <a class="{% if page.nav == 'notes' %}is-active{% endif %}" {% if page.nav == 'notes' %}aria-current="page"{% endif %} href="{{ '/notes.html' | relative_url }}">Notes</a>
                <a class="{% if page.nav == 'research' %}is-active{% endif %}" {% if page.nav == 'research' %}aria-current="page"{% endif %} href="{{ '/research.html' | relative_url }}">Research</a>
                <a class="{% if page.nav == 'projects' %}is-active{% endif %}" {% if page.nav == 'projects' %}aria-current="page"{% endif %} href="{{ '/projects.html' | relative_url }}">Projects</a>
                <a class="{% if page.nav == 'about' %}is-active{% endif %}" {% if page.nav == 'about' %}aria-current="page"{% endif %} href="{{ '/about.html' | relative_url }}">About</a>
            </nav>
        </div>
    </header>

    <div id="main-content">
        {{ content }}
    </div>

    <footer class="site-footer">
        <div class="site-footer__inner">
            <span>The Thinking Space</span>
            <span>All Rights Reserved</span>
        </div>
    </footer>
</body>
</html>
